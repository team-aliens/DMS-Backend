# PR 검증 전용
name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # job 이름 build 는 브랜치 보호의 필수 체크 이름이다. 바꾸면 PR 머지가 막힌다.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x gradlew

      - name: Verify Docker is running   # main-persistence 테스트가 Testcontainers 를 쓴다
        run: docker info

      # build 가 test 를 포함하므로 테스트 단계를 따로 두지 않는다.
      - name: Build, test and coverage
        run: ./gradlew build jacocoMainServiceReport --build-cache --no-daemon --stacktrace

      - name: Upload JaCoCo report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-main
          path: build/reports/jacoco/main-service/
          retention-days: 1

  # 필수 체크가 아니도록 별도 job 으로 둔다
  coverage-report:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-main
          path: build/reports/jacoco/main-service/

      - name: Delete previous JaCoCo comments
        run: |
          COMMENTS=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.body | contains("Coverage Report")) | .id')

          for comment_id in $COMMENTS; do
            echo "Deleting comment $comment_id"
            gh api repos/${{ github.repository }}/issues/comments/$comment_id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with main service coverage
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: |
            build/reports/jacoco/main-service/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 15
          min-coverage-changed-files: 50
          title: '📊 Main Service Coverage Report'
