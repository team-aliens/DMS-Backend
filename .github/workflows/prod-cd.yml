name: CD for Prod

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 수동 배포

permissions:
  contents: read

# 동시 배포 방지 — 연속 푸시가 와도 한 번에 하나만 순차 실행 (진행 중인 배포는 끊지 않고 대기)
concurrency:
  group: prod-cd
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 179895363651.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPO: dsm-dms

jobs:
  # ── 1) 테스트 게이트 ──────────────────────────────
  #  Dockerfile은 -x test로 빌드하므로, 배포 전 테스트는 여기서 돌린다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew :dms-main:test --build-cache --no-daemon

  # ── 2) 이미지 빌드 & ECR 푸시 ─────────────────────
  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .                       # 멀티모듈이라 컨텍스트는 레포 루트
          file: dms-main/Dockerfile
          push: true
          provenance: false
          # 서버 docker-compose.yml이 :latest를 참조하므로 latest를 밀고,
          # 롤백/추적용으로 커밋 SHA 태그도 함께 푸시
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3) EC2 SSH 배포 (pull + compose up) ───────────
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}   # 서버의 고정 호스트 키 (MITM 방지)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 매 실행마다 keyscan 하지 않고, 미리 고정해둔 호스트 키를 사용
          printf '%s\n' "$EC2_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd ~
          # 서버의 ~/.aws 자격증명으로 ECR 로그인
          aws ecr get-login-password --region ap-northeast-2 \
            | docker login --username AWS --password-stdin 179895363651.dkr.ecr.ap-northeast-2.amazonaws.com
          # 최신 이미지 pull 후 app 컨테이너만 재기동 (mysql/redis/nginx는 그대로 유지)
          docker compose pull app
          docker compose up -d app
          # app 컨테이너 상태 확인
          cid=$(docker compose ps -q app)
          if [ -z "$cid" ]; then echo "app container not found"; docker compose logs --tail=80 app; exit 1; fi
          # healthy 가 될 때까지 최대 120초 대기 (중간에 죽으면 즉시 실패)
          for i in $(seq 1 24); do
            s=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
            if [ "$s" = healthy ] || [ "$s" = running ]; then echo "app: $s"; break; fi
            case "$s" in exited|dead) echo "app terminated: $s"; docker compose logs --tail=80 app; exit 1;; esac
            if [ "$i" -eq 24 ]; then echo "health timeout: $s"; docker compose logs --tail=80 app; exit 1; fi
            sleep 5
          done
          # 이전 이미지 정리
          docker image prune -f
          REMOTE
