name: CD for Prod

# main 브랜치 push 로는 배포되지 않는다. GitHub Release 를 publish 해야 운영에 반영된다.
on:
  release:
    types: [published]
  workflow_dispatch:        # 수동 배포 · 롤백 — 되돌릴 태그를 직접 지정한다
    inputs:
      tag:
        description: '배포할 릴리스 태그 (예: v2.2.9)'
        required: true
        type: string

permissions:
  contents: read

# 동시 배포 방지 — 릴리스가 연달아 나와도 한 번에 하나만 순차 실행 (진행 중인 배포는 끊지 않고 대기)
concurrency:
  group: prod-cd
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 179895363651.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPO: dsm-dms

jobs:
  # ── 0) 배포 대상 버전 확정 ────────────────────────
  #  이후 모든 job 은 브랜치가 아니라 이 태그를 checkout 한다.
  resolve:
    # 프리릴리스는 운영에 나가지 않는다. 수동 실행(롤백)은 항상 허용.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # 태그를 해석하기만 하면 되므로 트리/블롭은 받지 않는다 (filter=tree:0)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - id: resolve
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "배포할 릴리스 태그를 찾지 못했다" >&2
            exit 1
          fi
          # 이 값이 그대로 ECR 이미지 태그가 된다 — OCI 태그 문자셋(128자)을 벗어나면 push 가 깨진다.
          # git 은 태그명에 '/' 도 셸 메타문자($( ) · 백틱 · ; · |)도 허용하므로 여기서 같이 걸러낸다.
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "이미지 태그로 쓸 수 없는 형식이다: $TAG" >&2
            exit 1
          fi
          # 수동 실행에 브랜치명이나 임의 커밋을 넣어 Release 없이 운영에 나가는 걸 막는다.
          # 동시에 애노테이트 태그를 커밋 SHA 로 푼다 — 이후 job 은 태그가 아니라 이 SHA 를 checkout 한다.
          if ! SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            echo "refs/tags 에 없는 태그다: $TAG" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          printf '### 배포 대상: `%s` (%s)\n' "$TAG" "$SHA" >> "$GITHUB_STEP_SUMMARY"

  # ── 1) 테스트 게이트 ──────────────────────────────
  #  Dockerfile은 -x test로 빌드하므로, 배포 전 테스트는 여기서 돌린다.
  #  ※ :dms-main:test 는 껍데기 프로젝트 자신의 test 라 NO-SOURCE 로 통과한다 — 서브모듈까지 도는 check 를 쓸 것
  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}   # 태그가 아니라 resolve 가 확정한 커밋
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x gradlew
      - name: Verify Docker is running   # main-persistence 테스트가 Testcontainers 를 쓴다
        run: docker info
      - name: Run tests
        run: ./gradlew check --build-cache --no-daemon

  # ── 2) 이미지 빌드 & ECR 푸시 ─────────────────────
  build-push:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .                       # 멀티모듈이라 컨텍스트는 레포 루트
          file: dms-main/Dockerfile
          push: true
          provenance: false
          # 릴리스 태그가 정본이고, 서버 docker-compose.yml이 :latest를 참조하므로 latest도 같은 이미지로 민다.
          # (latest = "가장 최근 릴리스"이지 "가장 최근 main 커밋"이 아니다)
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ needs.resolve.outputs.version }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ needs.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3) EC2 SSH 배포 (pull + compose up) ───────────
  deploy:
    needs: [resolve, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}   # 서버의 고정 호스트 키 (MITM 방지)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 매 실행마다 keyscan 하지 않고, 미리 고정해둔 호스트 키를 사용
          printf '%s\n' "$EC2_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" bash -se -- "$VERSION" <<'REMOTE'
          set -euo pipefail
          VERSION="${1:-unknown}"
          echo "deploying $VERSION"
          cd ~
          # 서버의 ~/.aws 자격증명으로 ECR 로그인
          aws ecr get-login-password --region ap-northeast-2 \
            | docker login --username AWS --password-stdin 179895363651.dkr.ecr.ap-northeast-2.amazonaws.com
          # 최신 이미지 pull 후 app 컨테이너만 재기동 (mysql/redis/nginx는 그대로 유지)
          docker compose pull app
          docker compose up -d app
          # app 컨테이너 상태 확인
          cid=$(docker compose ps -q app)
          if [ -z "$cid" ]; then echo "app container not found"; docker compose logs --tail=80 app; exit 1; fi
          # healthy 가 될 때까지 최대 120초 대기 (중간에 죽으면 즉시 실패)
          for i in $(seq 1 24); do
            s=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
            if [ "$s" = healthy ] || [ "$s" = running ]; then echo "app: $s"; break; fi
            case "$s" in exited|dead) echo "app terminated: $s"; docker compose logs --tail=80 app; exit 1;; esac
            if [ "$i" -eq 24 ]; then echo "health timeout: $s"; docker compose logs --tail=80 app; exit 1; fi
            sleep 5
          done
          # 이전 이미지 정리
          docker image prune -f
          echo "deployed $VERSION"
          REMOTE

      - name: Summary
        env:   # run: 에 직접 보간하면 태그명에 들어간 $( ) · 백틱이 러너에서 실행된다
          DEPLOY_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          printf '### 배포 완료 — `%s`\n' "$DEPLOY_VERSION" >> "$GITHUB_STEP_SUMMARY"
