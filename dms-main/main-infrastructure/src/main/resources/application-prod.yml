spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${MAIN_DB_HOST:127.0.0.1}:${MAIN_DB_PORT:5432}/${MAIN_DB_NAME:prod_dms}?reWriteBatchedInserts=true
    username: ${MAIN_DB_USERNAME}
    password: ${MAIN_DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:1234}

  jpa:
    properties:
      hibernate:
        show_sql: ${MAIN_PROD_SHOW_SQL:false}
