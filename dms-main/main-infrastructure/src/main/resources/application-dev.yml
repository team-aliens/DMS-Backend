spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${MAIN_DB_HOST}:${MAIN_DB_PORT:5432}/${MAIN_DB_NAME:stag_dms}?reWriteBatchedInserts=true
    username: ${MAIN_DB_USERNAME}
    password: ${MAIN_DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:1234}

  jpa:
    properties:
      hibernate:
        show_sql: ${MAIN_DEV_SHOW_SQL:false}
